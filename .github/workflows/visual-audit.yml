name: Automated UI Visual Audit

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  audit-frontend:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies & Headless Browser
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Start Preview Server & Capture Screenshot
        run: |
          npm run preview -- --port 4173 &
          npx wait-on http://localhost:4173
          npx playwright screenshot --wait-for-timeout=2000 http://localhost:4173 ui-snapshot.png

      - name: Send Screenshot to Gemini Vision
        id: run_audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node - << 'EOF'
          import { GoogleGenAI } from '@google/genai';
          import fs from 'fs';

          async function analyze() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            const imageBase64 = fs.readFileSync('ui-snapshot.png').toString('base64');

            const prompt = `
            You are a Senior Frontend UI Reviewer checking this implementation against our design rules.
            Examine this rendered webpage screenshot:
            1. Identify visual bugs: layout overlaps, clipping, z-index collisions, improper text contrast.
            2. Evaluate Tailwind spacing, responsive borders, and typography hierarchy.
            3. Provide concise, bulleted Tailwind class fixes ready to hand off to a developer.
            `;

            const response = await ai.models.generateContent({
              model: 'gemini-1.5-flash',
              contents: [
                { text: prompt },
                { inlineData: { mimeType: 'image/png', data: imageBase64 } }
              ]
            });

            fs.writeFileSync('audit-feedback.md', response.text);
          }
          analyze();
          EOF

      - name: Post Audit Feedback to Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const feedback = fs.readFileSync('audit-feedback.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Automated Gemini Vision Audit\n\n${feedback}`
            });